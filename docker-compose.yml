services:
  quoteblaze-database:
    container_name: quoteblaze-database
    image: postgres:18
    environment:
      - POSTGRES_DB=quoteblaze
      - POSTGRES_USER=quoteblaze
      - POSTGRES_PASSWORD=172115205
    volumes:
      - quoteblaze_db_data:/var/lib/postgresql
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quoteblaze"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quoteblaze

  quoteblaze-db-init:
    container_name: quoteblaze-db-init
    image: quoteblaze-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - DATABASE_URL=postgresql://quoteblaze:172115205@quoteblaze-database:5432/quoteblaze
    depends_on:
      quoteblaze-database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quoteblaze:172115205@quoteblaze-database:5432/quoteblaze
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
    volumes:
      - /app/node_modules
    command:
      - sh
      - -c
      - pnpm db:migrate && pnpm db:seed
    restart: "no"
    networks:
      - quoteblaze

  quoteblaze-web:
    container_name: quoteblaze-web
    image: quoteblaze-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - DATABASE_URL=postgresql://quoteblaze:172115205@quoteblaze-database:5432/quoteblaze
    ports:
      - "3001:3000"
    depends_on:
      quoteblaze-database:
        condition: service_healthy
      quoteblaze-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://quoteblaze:172115205@quoteblaze-database:5432/quoteblaze
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3001}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openrouter/free}
    volumes:
      - /app/node_modules
    networks:
      - quoteblaze

volumes:
  quoteblaze_db_data:

networks:
  quoteblaze:
    driver: bridge